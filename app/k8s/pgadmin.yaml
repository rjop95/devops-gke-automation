apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: production
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: admin@ricardojop.com
        - name: PGADMIN_DEFAULT_PASSWORD
          value: ClaveSegura2026!
        - name: PGADMIN_LISTEN_ADDRESS
          value: "0.0.0.0"
        # --- VARIABLE NATIVA DE GUNICORN PARA EL SUBPATH ---
        - name: SCRIPT_NAME
          value: "/pgadmin"
        volumeMounts:
        - name: config-distro-volume
          mountPath: /pgadmin4/config_distro.py
          subPath: config_distro.py
      volumes:
      - name: config-distro-volume
        configMap:
          name: pgadmin-distro-config
