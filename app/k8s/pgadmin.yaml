apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: production
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: admin@ricardojop.com
        - name: PGADMIN_DEFAULT_PASSWORD
          value: ClaveSegura2026!
        # 1. El nombre del script DEBE ir sin comillas internas si usamos las variables de proxy nativas
        - name: PGADMIN_CONFIG_SCRIPT_NAME
          value: /pgadmin
        # 2. Habilita que pgAdmin acepte las cabeceras del Ingress (X-Forwarded-For, etc.)
        - name: PGADMIN_CONFIG_PROXY_X_FORW_ENBL
          value: "True"
        # 3. ESTA ES LA QUE CORRIGE EL REDIRECT 302: Fuerza a Flask a respetar el SCRIPT_NAME en las respuestas redirect
        - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
          value: "False"
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: production
spec:
  selector:
    app: pgadmin
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
