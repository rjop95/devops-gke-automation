apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:latest
        ports:
        - containerPort: 80
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "admin@ricardojop.com"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "PasswordSeguro123"
        - name: PGADMIN_DIR_DATA
          value: "/tmp/pgadmin_data"
        - name: PGADMIN_DIR_RUNTIME
          value: "/tmp/pgadmin_runtime"
        # --- Solución de enrutamiento para Ingress ---
        - name: PGADMIN_CONFIG_SCRIPT_NAME
          value: '"/pgadmin"' # <--- OJO: Comilla simple, comilla doble, /pgadmin, comilla doble, comilla simple
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: production
spec:
  type: ClusterIP      # Se mantiene interno; el Ingress se encarga de exponerlo afuera
  selector:
    app: pgadmin
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
