apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-deployment
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mi-app
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      containers:
      - name: mi-app-container
        image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/app-repo/my-app:latest
        ports:
        - containerPort: 8080
        # L2 Feature: Self-healing via Probes
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
