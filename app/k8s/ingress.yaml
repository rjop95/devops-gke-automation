apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Mantenemos la reescritura limpia para entregar la raíz al pod
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. pgAdmin
      - path: /pgadmin(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80

      # 2. Tu API de Flask (Atrapa la raíz pura)
      - path: /($|.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mi-app-service
            port:
              number: 8080
