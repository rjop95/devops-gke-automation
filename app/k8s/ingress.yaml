apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: production
  annotations:
    # Le avisa a los servicios qué prefijo están usando afuera en internet
    nginx.ingress.kubernetes.io/x-forwarded-prefix: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. API de Flask (Sigue respondiendo en la raíz)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mi-app-service
            port:
              number: 8080

      # 2. pgAdmin (Mantiene su prefijo /pgadmin intacto hacia el pod)
      - path: /pgadmin
        pathType: Prefix
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
