apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: production
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. Todo lo que vaya a /pgadmin se manda al service directo
      - path: /pgadmin
        pathType: Prefix
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80

      # 2. Tu API de Flask en la raíz
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mi-app-service
            port:
              number: 8080
