apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: production
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Esta línea limpia la ruta antes de enviarla al pod de pgAdmin
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # ESTA ES LA CLAVE: Le avisa al proxy que mantenga el prefijo en las redirecciones del navegador
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix "/pgadmin";
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. pgAdmin
      - path: /pgadmin(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80

      # 2. Tu API de Flask (Atrapa la raíz pura)
      - path: /($|.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mi-app-service
            port:
              number: 8080
