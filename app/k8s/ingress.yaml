apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mi-app-ingress
  namespace: production
  annotations:
    # Mapea dinámicamente las subrutas capturadas en las reglas de abajo
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # 1. API de Flask (Dominio raíz y todas sus rutas como /usuarios, /init-db)
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mi-app-service
            port:
              number: 8080

      # 2. pgAdmin (Captura la ruta base /pgadmin y cualquier sub-recurso interno)
      - path: /(pgadmin.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: pgadmin-service
            port:
              number: 80
